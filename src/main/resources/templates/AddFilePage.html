<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Upload a file | Safe Image Storage</title>
<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
<script src="https://kit.fontawesome.com/a076d05399.js"
	crossorigin="anonymous"></script>
<link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="app-page">
	<div th:replace="~{UserNavbar.html :: usernav('upload')}"></div>
	<main class="app-main">
		<div class="page-heading">
			<span class="page-eyebrow">GROW YOUR COLLECTION</span>
			<h1>Upload a file</h1>
			<p>Add an image or document to your personal file space.</p>
		</div>
		<section class="app-panel upload-panel">
			<form th:action="@{/uploadfile}" method="post" enctype="multipart/form-data">
				<div class="mb-3">
					<label for="name" class="form-label">File name</label>
					<input type="text" class="form-control" name="name" id="name" placeholder="Give your file a name">
				</div>
				<div class="mb-4">
					<label for="image" class="form-label">Choose a file</label>
					<div class="upload-dropzone">
						<input type="file" class="form-control" name="imageData" id="image">
					</div>
				</div>
				<button type="submit" class="btn btn-primary w-100">
					<i class="fas fa-cloud-upload-alt me-2" aria-hidden="true"></i>Save to my files
				</button>
			</form>
			<div class="text-center mt-3">
				<a class="back-link" th:href="@{/getallfiles}"><i class="fas fa-arrow-left me-1" aria-hidden="true"></i> Back to my files</a>
			</div>
		</section>
	</main>
</body>
</html>
