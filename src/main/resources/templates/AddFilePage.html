<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registration Form</title>
<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
<script src="https://kit.fontawesome.com/a076d05399.js"
	crossorigin="anonymous"></script>
<link rel="stylesheet" href="USernavbar.css"
	th:href="@{/css/USernavbar.css}" />
<style>
body {
	background: linear-gradient(135deg, #f8cdda, #1d2b64);
	height: 100vh;
	display: flex;
	justify-content: center;
	align-items: center;
}

.card {
	border-radius: 20px;
	box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
	background: white;
}

.form-control {
	border-radius: 10px;
}

.btn-custom {
	background: #ff758c;
	color: white;
	border-radius: 10px;
	transition: 0.3s;
}

.btn-custom:hover {
	background: #ff416c;
}
</style>
</head>
<body>
	<header th:insert="UserNavbar.html::usernav"></header>
	<div class="container mt-5">
		<!-- Your main content goes here -->
		<div class="container">
			<div class="row justify-content-center">
				<div class="col-md-6">
					<div class="card p-4">
						<h2 class="text-center text-primary">Add Your file Here</h2>
						<form action="uploadfile" method="post"
							enctype="multipart/form-data">
							<div class="mb-3">
								<label for="name" class="form-label">Name</label> <input
									type="text" class="form-control" name="name" id="name"
									placeholder="Enter Name">
							</div>
							<div class="mb-3">
								<label for="type" class="form-label">Type</label> <input
									type="text" class="form-control" name="type" id="type"
									placeholder="Enter Type">
							</div>
							<div class="mb-3">
								<label for="image" class="form-label">Upload Image</label> <input
									type="file" class="form-control" name="imageData" id="image">
							</div>
							<button type="submit" class="btn btn-custom w-100">Register</button>
						</form>
					</div>
				</div>
			</div>
		</div>
	</div>
</body>
</html>
