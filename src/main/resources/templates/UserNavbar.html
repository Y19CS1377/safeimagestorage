<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <header th:fragment="usernav(activePage)">
        <nav class="navbar navbar-custom">
            <div class="container-fluid d-flex justify-content-between align-items-center">
                <a class="navbar-brand" th:href="@{/home}">
                    <i class="fas fa-cloud" aria-hidden="true"></i> Safe Image Storage
                </a>
                <div class="d-flex align-items-center app-nav-links">
                    <a th:href="@{/home}" class="nav-link" th:classappend="${activePage == 'home'} ? ' active' : ''" th:attr="aria-current=${activePage == 'home'} ? 'page' : null"><i class="fas fa-home" aria-hidden="true"></i> Home</a>
                    <a th:href="@{/getallfiles}" class="nav-link" th:classappend="${activePage == 'files'} ? ' active' : ''" th:attr="aria-current=${activePage == 'files'} ? 'page' : null"><i class="fas fa-images" aria-hidden="true"></i> My Files</a>
                    <a th:href="@{/getaddfilepage}" class="nav-link" th:classappend="${activePage == 'upload'} ? ' active' : ''" th:attr="aria-current=${activePage == 'upload'} ? 'page' : null"><i class="fas fa-plus-circle" aria-hidden="true"></i> Upload</a>
                    <a th:href="@{/profilepage}" class="nav-link" th:classappend="${activePage == 'profile'} ? ' active' : ''" th:attr="aria-current=${activePage == 'profile'} ? 'page' : null"><i class="fas fa-user" aria-hidden="true"></i> Profile</a>
                    <a href="#" class="nav-link nav-logout" onclick="confirmLogout(); return false;">
                        <i class="fas fa-sign-out-alt" aria-hidden="true"></i> Logout
                    </a>
                </div>
            </div>
        </nav>

        <div class="modal fade" id="logoutModal" tabindex="-1" aria-labelledby="logoutModalLabel" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content app-modal">
                    <div class="modal-header">
                        <h5 class="modal-title" id="logoutModalLabel">Sign out?</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">Are you sure you want to leave your file space?</div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-soft" data-bs-dismiss="modal">Stay here</button>
                        <a th:href="@{/logout}" class="btn btn-primary app-primary-button">Sign out</a>
                    </div>
                </div>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        <script>
            function confirmLogout() {
                const logoutModal = new bootstrap.Modal(document.getElementById('logoutModal'));
                logoutModal.show();
            }
        </script>
    </header>
</body>
</html>
