<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<title>My Dashboard</title>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
	<script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
	<link rel="stylesheet" href="USernavbar.css" th:href="@{/css/USernavbar.css}" />
<style>
body {
	background: linear-gradient(to right, #4e54c8, #8f94fb);
	color: white;
	font-family: 'Poppins', sans-serif;
}

.navbar-custom {
	position: fixed;
	top: 0;
	left: 0;
	width: 100%;
	z-index: 1000; /* Ensures navbar stays above other content */
	background: rgba(0, 0, 0, 0.9);
	/* Slightly darker for better visibility */
	border-bottom: 2px solid #fff;
	padding: 10px 20px;
}

body {
	padding-top: 60px;
	/* Prevents content from being hidden under the navbar */
}

.nav-link {
	color: white;
	transition: 0.3s;
	margin-left: 15px;
}

.nav-link:hover {
	color: #ffdd57;
	transform: scale(1.1);
}

.profile-img {
	width: 40px;
	height: 40px;
	border-radius: 50%;
	object-fit: cover;
	margin-right: 10px;
}

.modal-content {
	background: #2c3e50;
	color: white;
}

.btn-danger {
	background: #e74c3c;
}
</style>
</head>
<body>
	<header th:fragment="usernav">
		<!-- Top Navigation Bar -->
		<nav class="navbar navbar-custom">
			<div class="container-fluid d-flex justify-content-between align-items-center">
				<div class="d-flex align-items-center">
					<span class="navbar-brand text-white"><i class="fas fa-user-circle"></i> Welcome!</span>
        		</div>
				<div class="d-flex">
			 		<a th:href="@{/profilepage}" class="nav-link"> <i class="fas fa-user"></i> Profile</a>		
					<a href="/home" class="nav-link"> <i class="fas fa-user-edit"></i>Home</a>
					<a href="/getallfiles" class="nav-link"> <i class="fas fa-images"></i> My Images</a> 
					<a href="/getaddfilepage" class="nav-link"> <i class="fas fa-plus-circle"></i> Add Image</a> 
					<a href="#" class="nav-link" onclick="confirmLogout()"> <i class="fas fa-sign-out-alt"></i> Logout</a>
				</div>
			</div>
		</nav>

		<!-- Logout Confirmation Modal -->
		<div class="modal fade" id="logoutModal" tabindex="-1" aria-labelledby="logoutModalLabel" aria-hidden="true">
			<div class="modal-dialog">
				<div class="modal-content">
					<div class="modal-header">
						<h5 class="modal-title" id="logoutModalLabel">Confirm Logout</h5>
						<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
					</div>
					<div class="modal-body">Are you sure you want to logout?</div>
					<div class="modal-footer">
						<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">No</button>
						<a href="/logout" class="btn btn-danger">Yes, Logout</a>
					</div>
				</div>
			</div>
		</div>

		<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
		<script>
	        function confirmLogout() {
	            const logoutModal = new bootstrap.Modal(document.getElementById('logoutModal'));
	            logoutModal.show();
	        }
    	</script>
	</header>
</body>
</html>
