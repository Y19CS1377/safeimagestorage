<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(to right, #74ebd5, #acb6e5);
            font-family: 'Arial', sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .card {
            background: white;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.2);
            padding: 30px;
            width: 350px;
        }
        h2 {
            font-weight: bold;
            text-align: center;
        }
        .form-control {
            border-radius: 8px;
        }
        .btn {
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
        }
        .btn:hover {
            background: #0056b3;
        }
        .text-muted {
            font-size: 14px;
            text-align: center;
        }
        #errorMessage {
            color: red;
            text-align: center;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Login</h2>
        
        <!-- Register Message -->
        <p class="text-muted">Don't have an account? <a href="getregisterpage" class="text-primary">Register here</a></p>
        
        <form id="loginForm" action="checkloginuser" method="post">
            <div class="mb-3">
                <input type="text" id="loginUsername" class="form-control" placeholder="Username" name="username" required>
            </div>
            <div class="mb-3">
                <input type="password" id="loginPassword" class="form-control" placeholder="Password"  name="password" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Login</button>
        </form>
        
        <!-- Error Message -->
        <div id="errorMessage"></div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
