<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in | Safe Image Storage</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</head>
<body class="auth-page">
    <main class="auth-shell">
        <section class="auth-visual">
            <a class="auth-brand" th:href="@{/}"><i class="fas fa-cloud" aria-hidden="true"></i> Safe Image Storage</a>
            <span class="page-eyebrow">YOUR FILES, YOUR SPACE</span>
            <h1>A calmer home for the things you want to keep.</h1>
            <p>Bring your images and important files together, ready whenever you need them.</p>
        </section>
        <section class="auth-panel">
            <span class="page-eyebrow">WELCOME BACK</span>
            <h2>Sign in</h2>
            <p class="auth-intro">Pick up right where you left off in your personal file space.</p>
            <form id="loginForm" class="auth-form" th:action="@{/checkloginuser}" method="post">
                <label class="form-label" for="loginUsername">Username</label>
                <input type="text" id="loginUsername" class="form-control" placeholder="Enter your username" name="username" autocomplete="username" required>
                <label class="form-label" for="loginPassword">Password</label>
                <input type="password" id="loginPassword" class="form-control" placeholder="Enter your password" name="password" autocomplete="current-password" required>
                <button type="submit" class="btn btn-primary w-100">Sign in</button>
            </form>
            <div id="errorMessage" class="alert alert-danger d-none" role="alert"></div>
            <p class="auth-switch">New here? <a th:href="@{/getregisterpage}">Create an account</a></p>
        </section>
    </main>
</body>
</html>
