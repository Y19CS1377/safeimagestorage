<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create account | Safe Image Storage</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</head>
<body class="auth-page">
    <main class="auth-shell">
        <section class="auth-visual">
            <a class="auth-brand" th:href="@{/}"><i class="fas fa-cloud" aria-hidden="true"></i> Safe Image Storage</a>
            <span class="page-eyebrow">A SPACE OF YOUR OWN</span>
            <h1>Keep your favorite files close at hand.</h1>
            <p>Create your account and start collecting your photos and documents in one place.</p>
        </section>
        <section class="auth-panel">
            <span class="page-eyebrow">GET STARTED</span>
            <h2>Create account</h2>
            <p class="auth-intro">A few details and your personal file space is ready.</p>
            <form class="auth-form" th:action="@{/saveUser}" method="post">
                <label class="form-label" for="registerName">Full name</label>
                <input id="registerName" type="text" class="form-control" th:classappend="${nameError != null} ? ' is-invalid' : ''" th:value="${user.name}" th:attr="aria-invalid=${nameError != null}" aria-describedby="registerNameError" placeholder="Enter your full name" name="name" autocomplete="name" required>
                <div id="registerNameError" class="invalid-feedback" th:classappend="${nameError != null} ? ' d-block' : ''" th:text="${nameError}"></div>
                <label class="form-label" for="registerUsername">Username</label>
                <input id="registerUsername" type="text" class="form-control" th:classappend="${usernameError != null} ? ' is-invalid' : ''" th:value="${user.username}" th:attr="aria-invalid=${usernameError != null}" aria-describedby="registerUsernameError" placeholder="Choose a username" name="username" autocomplete="username" required>
                <div id="registerUsernameError" class="invalid-feedback" th:classappend="${usernameError != null} ? ' d-block' : ''" th:text="${usernameError}"></div>
                <label class="form-label" for="registerPassword">Password</label>
                <input id="registerPassword" type="password" class="form-control" th:classappend="${passwordError != null} ? ' is-invalid' : ''" th:attr="aria-invalid=${passwordError != null}" aria-describedby="registerPasswordError" placeholder="Create a password" name="password" autocomplete="new-password" required>
                <div id="registerPasswordError" class="invalid-feedback" th:classappend="${passwordError != null} ? ' d-block' : ''" th:text="${passwordError}"></div>
                <label class="form-label" for="registerPhone">Phone number</label>
                <input id="registerPhone" type="tel" class="form-control" th:classappend="${phoneNumberError != null} ? ' is-invalid' : ''" th:value="${user.phoneNumber}" th:attr="aria-invalid=${phoneNumberError != null}" aria-describedby="registerPhoneError" placeholder="Enter your phone number" name="phoneNumber" autocomplete="tel" required>
                <div id="registerPhoneError" class="invalid-feedback" th:classappend="${phoneNumberError != null} ? ' d-block' : ''" th:text="${phoneNumberError}"></div>
                <button type="submit" class="btn btn-primary w-100">Create my account</button>
            </form>
            <p class="auth-switch">Already have an account? <a th:href="@{/}">Sign in</a></p>
        </section>
    </main>
</body>
</html>
