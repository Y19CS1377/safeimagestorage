<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile</title>
    
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <style>
        body {
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            border-radius: 15px;
            background: rgba(255, 255, 255, 0.9);
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
        }
        .form-control {
            border-radius: 10px;
        }
        .btn-custom {
            background-color: #ff758c;
            color: white;
            border-radius: 10px;
        }
        .btn-custom:hover {
            background-color: #ff5e6c;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card p-4">
                <h3 class="text-center"><i class="fas fa-user-circle"></i> Edit Profile</h3>
                
                <form th:action="@{/updateProfile}" method="post" th:object="${user}">
    
    <!-- Hidden ID Field -->
    <input type="hidden" th:field="*{id}" />

    <div class="mb-3">
        <label class="form-label"><i class="fas fa-user"></i> Full Name</label>
        <input type="text" class="form-control" th:field="*{name}" name="name" required>
    </div>

    <div class="mb-3">
        <label class="form-label"><i class="fas fa-envelope"></i> Username</label>
        <input type="text" class="form-control" th:field="*{username}" name="username" readonly>
    </div>

    <div class="mb-3">
        <label class="form-label"><i class="fas fa-key"></i> Password</label>
        <input type="password" class="form-control" th:field="*{password}" name="password" required>
    </div>

    <div class="mb-3">
        <label class="form-label"><i class="fas fa-phone"></i> Phone Number</label>
        <input type="text" class="form-control" th:field="*{phoneNumber}" name="phoneNumber" required>
    </div>

    <div class="d-grid">
        <button type="submit" class="btn btn-custom"><i class="fas fa-save"></i> Save Changes</button>
    </div>
</form>

                <div class="text-center mt-3">
                    <a href="/getuserhome" class="btn btn-link"><i class="fas fa-arrow-left"></i> Back to Home</a>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
