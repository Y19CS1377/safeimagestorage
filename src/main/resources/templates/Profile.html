<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile settings | Safe Image Storage</title>
    
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    
    <!-- FontAwesome for Icons -->
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="app-page">
<div th:replace="~{UserNavbar.html :: usernav('profile')}"></div>
<main class="app-main">
    <div class="page-heading">
        <span class="page-eyebrow">YOUR ACCOUNT</span>
        <h1>Profile settings</h1>
        <p>Keep your account details up to date.</p>
    </div>
    <div class="app-panel profile-card">
        <h2><i class="fas fa-user-circle" aria-hidden="true"></i> Edit profile</h2>
                
                <form th:action="@{/updateProfile}" method="post" th:object="${user}">
    
    <!-- Hidden ID Field -->
    <input type="hidden" th:field="*{id}" />

    <div class="mb-3">
        <label class="form-label"><i class="fas fa-user"></i> Full Name</label>
        <input type="text" class="form-control" th:field="*{name}" name="name" required>
    </div>

    <div class="mb-3">
        <label class="form-label"><i class="fas fa-envelope"></i> Username</label>
        <input type="text" class="form-control" th:field="*{username}" name="username" readonly>
    </div>

    <div class="mb-3">
        <label class="form-label"><i class="fas fa-key"></i> Password</label>
        <input type="password" class="form-control" th:field="*{password}" name="password" required>
    </div>

    <div class="mb-3">
        <label class="form-label"><i class="fas fa-phone"></i> Phone Number</label>
        <input type="text" class="form-control" th:field="*{phoneNumber}" name="phoneNumber" required>
    </div>

    <div class="d-grid">
        <button type="submit" class="btn btn-primary app-primary-button"><i class="fas fa-save"></i> Save Changes</button>
    </div>
</form>

                <div class="text-center mt-3">
                    <a th:href="@{/home}" class="back-link"><i class="fas fa-arrow-left" aria-hidden="true"></i> Back to home</a>
                </div>
    </div>
</main>
</body>
</html>
