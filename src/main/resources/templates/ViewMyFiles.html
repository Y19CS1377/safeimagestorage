<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>My Files</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</head>

<body class="app-page">

    <!-- Navigation Bar -->
    <div th:replace="~{UserNavbar.html :: usernav('files')}"></div>
    
    
    <main class="app-main">
        <div class="page-heading d-flex flex-wrap justify-content-between align-items-end gap-3">
            <div>
                <span class="page-eyebrow">YOUR PERSONAL COLLECTION</span>
                <h1>My files</h1>
                <p>Browse, preview, and download the files you have saved.</p>
            </div>
            <a th:href="@{/getaddfilepage}" class="btn btn-primary">
                <i class="fas fa-upload" aria-hidden="true"></i> Upload a file
            </a>
        </div>

        <!-- No Images Message (Only Show If No Images Exist) -->
        <div th:if="${files == null or #lists.isEmpty(files)}" class="alert alert-warning text-center">
    No files available in your account.
</div>


        <!-- Files Table -->
        <div th:if="${files != null and !#lists.isEmpty(files)}" class="table-responsive">
            <table class="table table-hover">
                <thead class="table-dark">
                    <tr>
                        <th>Name</th>
                        <th>Type</th>
                        <th>Preview</th>
                        <th>Download</th>
                        <th>Delete</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="file : ${files}">
                        <td>
                            <i th:class="${file.type != null and file.type.toLowerCase().startsWith('image') ? 'fas fa-image' :
                                        file.type != null and file.type.startsWith('application/pdf') ? 'fas fa-file-pdf' :
                                        file.type != null and file.type.startsWith('application/msword') ? 'fas fa-file-word' :
                                        file.type != null and file.type.startsWith('application/vnd.ms-excel') ? 'fas fa-file-excel' :
                                        'fas fa-file-alt'}"></i>
                            <span th:text="${file.name}"></span>
                        </td>
                        <td th:text="${file.type}"></td>
                        <td>
                            <button th:if="${file.type != null and file.type.toLowerCase().startsWith('image')}"
                                class="btn btn-info btn-sm" onclick="showPreview(this)" th:data-url="@{'/file-images/' + ${file.id}}">
                                <i class="fas fa-eye"></i> Preview
                            </button>
                            <span th:unless="${file.type != null and file.type.startsWith('image')}">N/A</span>
                        </td>
                        <td>
                            <a th:href="@{'/download/' + ${file.id}}" class="btn btn-success btn-sm" download>
                                <i class="fas fa-download"></i> Download
                            </a>
                        </td>
                        <td>
                            <form th:action="@{'/delete/' + ${file.id}}" method="get"
                                onsubmit="return confirm('Are you sure you want to delete this file?');">
                                <button type="submit" class="btn btn-danger btn-sm">
                                    <i class="fas fa-trash-alt"></i> Delete
                                </button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <!-- Image Preview Modal -->
    <div class="modal fade" id="previewModal" tabindex="-1" aria-labelledby="previewModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Image Preview</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body text-center">
                    <img id="previewImage" src="" class="img-fluid rounded" alt="File Preview">
                    <p id="previewError" class="alert alert-warning mt-3 d-none" role="alert">
                        This file could not be previewed. Try downloading it instead.
                    </p>
                </div>
            </div>
        </div>
    </div>

    <script>
        function showPreview(button) {
            const previewImage = document.getElementById('previewImage');
            const previewError = document.getElementById('previewError');
            previewError.classList.add('d-none');
            previewImage.classList.remove('d-none');
            previewImage.onerror = function() {
                previewImage.classList.add('d-none');
                previewError.classList.remove('d-none');
            };
            previewImage.src = button.getAttribute('data-url');
            let previewModal = new bootstrap.Modal(document.getElementById('previewModal'));
            previewModal.show();
        }
    </script>
</body>

</html>
